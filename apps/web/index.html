<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cinemood — a personal cinema catalog, found by mood. Save films and series, find them back in plain English, watch them at your own pace." />
    <meta name="theme-color" content="#0A0908" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2EBDD" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Cinemood — your watchlist, by mood" />
    <meta property="og:description" content="A personal cinema catalog, found by mood." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,100..900,0..100;1,9..144,100..900,0..100&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>Cinemood — your watchlist, by mood</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("cm_theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
