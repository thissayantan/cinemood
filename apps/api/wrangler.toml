name = "cinemood"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6f96b54a60415fce0f7b33e17f2af17a"
workers_dev = true

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "cinemood"
database_id = "7a435117-ca7b-42d2-a3fc-6a48b2e9b8f8"

[[kv_namespaces]]
binding = "SESSIONS"
id = "62827fe4e93c4600866cb0563719325a"

[[kv_namespaces]]
binding = "CACHE"
id = "1231d520cb284034bbebab7f0b701d24"

[[r2_buckets]]
binding = "INDEX_BUCKET"
bucket_name = "cinemood-index"

[ai]
binding = "AI"

# Production environment — same bindings, route attached.
#
# Bound static assets: the Worker also serves the SPA build from
# apps/web/dist. Wrangler routes the request via run_worker_first:
#   /api/*  and /auth/* — handled by the Worker (Hono routes).
#   anything else       — served from assets, with SPA fallback to
#                         /index.html so client-side routes work.
#
# This consolidates SPA + API onto one Worker. The previous topology
# had a separate Cloudflare Pages project for the SPA, but that hit
# the "CNAME Cross-User Banned" (error 1014) wall when the Pages
# project lived on a different Cloudflare account from the
# `sayantan.cloud` zone — a CNAME from the zone to a `*.pages.dev`
# target is blocked by Cloudflare policy in that arrangement. Single
# Worker means the only DNS we need is a proxied placeholder record
# on the zone (any orange-clouded record will do — the Worker route
# intercepts before origin resolution). The dead Pages project has
# since been deleted; this comment stays for the lesson.
[env.production]
name = "cinemood"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[env.production.routes]]
pattern = "cinemood.sayantan.cloud/*"
zone_name = "sayantan.cloud"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cinemood"
database_id = "7a435117-ca7b-42d2-a3fc-6a48b2e9b8f8"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "62827fe4e93c4600866cb0563719325a"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "1231d520cb284034bbebab7f0b701d24"

[[env.production.r2_buckets]]
binding = "INDEX_BUCKET"
bucket_name = "cinemood-index"

[env.production.ai]
binding = "AI"
