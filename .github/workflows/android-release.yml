name: Android Release

# Fires on every v* tag push (e.g. v1.0.0) and supports manual re-runs.
# Builds a signed release APK and attaches it to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0) — used only for the release name on manual runs"
        required: true

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/cinemood.jks

      - name: Build release APK
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/cinemood.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          # On manual dispatch, use the workflow input instead
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=${{ github.event.inputs.tag }}
          fi
          mv apps/android/app/build/outputs/apk/release/app-release.apk \
             cinemood-${TAG}.apk
          echo "APK_NAME=cinemood-${TAG}.apk" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'refs/heads/main' && github.ref_name || github.event.inputs.tag }}
          name: "Cinemood ${{ github.ref_name != 'refs/heads/main' && github.ref_name || github.event.inputs.tag }}"
          body: |
            ## Install

            1. On your Android device, go to **Settings → Apps → Special app access → Install unknown apps** and allow your browser or file manager.
            2. Download `${{ env.APK_NAME }}` below.
            3. Tap the downloaded file and follow the install prompts.

            Requires Android 8.0 (API 26) or later.
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
